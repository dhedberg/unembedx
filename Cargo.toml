[package]
name = "unembedx"
version = "0.1.0"
authors = ["David Hedberg <david.hedberg@gmail.com>"]
edition = "2021"

[features]
default = ["filetypes"]
filetypes = ["magic", "new_mime_guess"]

[dependencies]
anyhow = "1.0"
cfb = "0.10"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
env_logger = "0.11"
lazy_static = "1.5"
log = "0.4"
magic = { version = "0.16", optional = true }
new_mime_guess = { version = "4.0", optional = true }
tempfile = "3.12"
zip = "2.2"
